name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer test
      # The Docker tests don't depend on the PHP version much; run them once to save runner time.
      - name: Integration tests against a real sshd
        if: matrix.php == '8.3'
        run: scripts/test-ssh
      - name: Recipe tests in a Debian container
        if: matrix.php == '8.3'
        run: scripts/test-recipes
